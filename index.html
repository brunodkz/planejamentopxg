<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📘 Planejamento PXG</title>

<style>

/* BASE */
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* HEADER */
.header {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(255,255,255,0.92);
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

/* GRID */
.grid {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  padding: 10px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.9);
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  transition: transform 0.25s;
}

.card:hover {
  transform: scale(1.05);
}

/* 🔥 PADRÃO DEFINITIVO DAS GIFS */
.card img {
  width: 96px;
  height: 96px;
  object-fit: contain;
  margin-bottom: 10px;
  image-rendering: pixelated;
}

.card h3 {
  margin: 6px 0;
}

/* BOTÃO */
.card a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 14px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 0.85rem;
  color: #fff;
  text-decoration: none;
}

/* CORES */
.dragonair a { background: #fbc02d; color:#2b2b2b; }
.glaceon a   { background: linear-gradient(135deg,#00e5ff,#0288d1); }
.luxray a    { background: #0d2a4a; }
.machamp a   { background: #e65100; }
.tangela a   { background: #2e7d32; }
.blastoise a{ background: linear-gradient(135deg,#00bcd4,#0288d1); }
.feraligatr a{ background: linear-gradient(135deg,#0d47a1,#26c6da); }
.meganium a { background: linear-gradient(135deg,#b39ddb,#6a1b9a); }

</style>
</head>

<body>

<div class="header">
  <h1>📘 Planejamento PXG</h1>
  <p>Registros históricos • Conquistas • Negociações</p>
</div>

<div class="grid">

  <div class="card dragonair">
    <img src="assets/shiny-dragonair.gif">
    <h3>🐉 Shiny Dragonair</h3>
    <a href="registro-shiny-dragonair.html">Abrir registro</a>
  </div>

  <div class="card feraligatr">
    <img src="assets/shiny-feraligatr.gif">
    <h3>🐊 Shiny Feraligatr</h3>
    <a href="registro-shiny-feraligatr.html">Abrir registro</a>
  </div>

  <div class="card blastoise">
    <img src="assets/shiny-blastoise.gif">
    <h3>🐢 Shiny Blastoise</h3>
    <a href="registro-shiny-blastoise.html">Abrir registro</a>
  </div>

  <div class="card meganium">
    <img src="assets/shiny-meganium.gif">
    <h3>🌸 Shiny Meganium</h3>
    <a href="registro-shiny-meganium.html">Abrir registro</a>
  </div>

</div>

</body>
</html>
