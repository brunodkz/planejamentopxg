<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 Planejamento PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("./assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* BOTÃO VOLTAR */
.back-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  background: linear-gradient(135deg,#424242,#000);
  color: #fff;
  padding: 10px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  transition: transform 0.2s, opacity 0.2s;
  z-index: 999;
}

.back-btn:hover {
  transform: scale(1.05);
  opacity: 0.9;
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: 30px auto;
  background: rgba(255,255,255,0.95);
  padding: 26px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 26px;
}

/* TABS */
.tabs {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 26px;
}

.tab-btn {
  border: none;
  padding: 10px 18px;
  border-radius: 14px;
  font-weight: bold;
  cursor: pointer;
  background: #e0e0e0;
}

.tab-btn.active {
  background: linear-gradient(135deg,#7cb342,#fbc02d);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

/* CARD */
.card {
  background: #f7f7f7;
  padding: 16px;
  border-radius: 16px;
  text-align: center;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

/* INFO */
.info {
  display: none;
  margin-top: 12px;
  padding: 14px;
  background: #fafafa;
  border-radius: 14px;
  box-shadow: inset 0 0 0 2px #ddd;
  animation: fade 0.3s ease;
}

.info.active {
  display: block;
}

.info a {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 14px;
  border-radius: 14px;
  background: #1976d2;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
}

/* TAB CONTENT */
.tab-content { display: none; }
.tab-content.active { display: block; }

@keyframes fade {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- BOTÃO VOLTAR -->
<a href="index.html" class="back-btn">⬅️ Voltar ao Menu</a>

<div class="container">

<div class="header">
  <h1>📘 Planejamento PXG</h1>
  <p>Conquistas • Registros • Crafts</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="openTab('t1', this)">⭐ Shiny T1</button>
  <button class="tab-btn" onclick="openTab('t2', this)">🔥 Shiny T2</button>
</div>

<div id="t1" class="tab-content active">
<div class="grid">

<div class="card" onclick="toggleInfo(this)">
❄️ Shiny Glaceon
<div class="info">
Status: Ativo<br>
Valor estimado: 22kk<br>
Observação: Hunt solo eficiente<br>
<a href="registro-shiny-glaceon.html">Abrir registro</a>
</div>
</div>

</div>
</div>

<div id="t2" class="tab-content">
<div class="grid">

<div class="card" onclick="toggleInfo(this)">
🐲 Shiny Druddigon
<div class="info">
Status: Ativo<br>
Valor estimado: 35kk<br>
Observação: Tier alto<br>
<a href="registro-shiny-druddigon.html">Abrir registro</a>
</div>
</div>

</div>
</div>

</div>

<script>
function openTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function toggleInfo(card) {
  card.querySelector('.info').classList.toggle('active');
}
</script>

</body>
</html>
