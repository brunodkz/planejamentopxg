<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 Planejamento PXG</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: url("./assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

.header {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(255,255,255,0.95);
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header p {
  margin: 6px 0 0;
  color: #444;
}

.grid {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  padding: 12px;
}

.card {
  background: rgba(255,255,255,0.95);
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  transition: transform 0.25s;
}

.card:hover {
  transform: scale(1.05);
}

.gif-box img {
  width: 88px;
  image-rendering: pixelated;
  margin-bottom: 10px;
}

.gif-box {
  font-size: 64px;
  margin-bottom: 10px;
}

.card h3 {
  margin: 6px 0;
  font-size: 1rem;
}

.badge {
  display: inline-block;
  margin-top: 4px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: bold;
  color: #fff;
}

.card a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
  padding: 6px 14px;
  min-width: 130px;
  border-radius: 14px;
  font-weight: bold;
  font-size: 0.85rem;
  text-decoration: none;
  color: #fff;
  transition: transform 0.2s, box-shadow 0.2s;
}

.card a:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.35);
}

/* CORES */
.crafts a { background:linear-gradient(135deg,#7cb342,#fbc02d); color:#222; }
.conquistas a { background:linear-gradient(135deg,#ffb300,#f57c00); color:#222; }
</style>
</head>

<body>

<div class="header">
  <h1>📘 Planejamento PXG</h1>
  <p>Registros • Conquistas • Crafts</p>
</div>

<div class="grid">

  <!-- CONQUISTAS -->
  <div class="card conquistas">
    <div class="gif-box">🏆</div>
    <h3>Conquistas & Negociações</h3>
    <span class="badge" style="background:#f57c00;">Shinys • Trocas</span>
    <a href="conquistas-negociacoes.html">Abrir área</a>
  </div>

  <!-- CRAFTS -->
  <div class="card crafts">
    <div class="gif-box">🛠️</div>
    <h3>Crafts</h3>
    <span class="badge" style="background:#7cb342;color:#222;">
      Frutas • Itens • Recursos
    </span>
    <a href="crafts.html">Abrir área</a>
  </div>

</div>

</body>
</html>
