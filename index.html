/* 🚑 MODO EMERGÊNCIA CONTROLADO (SEM QUEBRAR LAYOUT) */
body,
.header,
.grid,
.card,
.card * {
  visibility: visible !important;
  opacity: 1 !important;
}

/* 🔥 BACKGROUND */
html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
  min-height: 100vh;
}

/* HEADER */
.header {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(255,255,255,0.92);
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header h1 {
  margin: 0;
}

.header p {
  margin: 6px 0 0;
  color: #444;
}

/* GRID */
.grid {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  padding: 10px;
}
