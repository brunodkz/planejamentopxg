<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📘 Planejamento PXG</title>

<style>

/* BASE */
html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* HEADER */
.header {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(255,255,255,0.92);
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header p {
  margin: 6px 0 0;
  color: #444;
}

/* GRID */
.grid {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  padding: 10px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.9);
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  transition: transform 0.25s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  max-width: 140px;
  margin-bottom: 10px;
}

.card h3 {
  margin: 6px 0;
}

/* BOTÃO BASE */
.card a {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  margin-top: 8px;
  padding: 6px 14px;

  min-width: 120px;
  min-height: 32px;

  border-radius: 12px;
  font-weight: bold;
  font-size: 0.85rem;

  text-decoration: none;
  color: #fff;
  transition: transform 0.2s, box-shadow 0.2s;
}

.card a:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.35);
}

/* CORES POR POKÉMON */
.dragonair a {
  background: #fbc02d;
  color: #2b2b2b;
}

.glaceon a {
  background: linear-gradient(135deg, #00e5ff, #0288d1);
}

.luxray a {
  background: #0d2a4a;
}

.machamp a {
  background: #e65100;
}

.tangela a {
  background: #2e7d32;
}

/* BLASTOISE – WATER TYPE */
.blastoise a {
  background: linear-gradient(135deg, #00bcd4, #0288d1);
}

</style>
</head>

<body>

<div class="header">
  <h1>📘 Planejamento PXG</h1>
  <p>Registros históricos • Conquistas • Negociações</p>
</div>

<div class="grid">

  <!-- SHINY DRAGONAIR -->
  <div class="card dragonair">
    <img src="assets/shiny-dragonair.gif">
    <h3>🐉 Shiny Dragonair</h3>
    <a href="registro-shiny-dragonair.html">Abrir registro</a>
  </div>

  <!-- SHINY GLACEON -->
  <div class="card glaceon">
    <img src="assets/shiny-glaceon.gif">
    <h3>❄️ Shiny Glaceon</h3>
    <a href="registro-shiny-glaceon.html">Abrir registro</a>
  </div>

  <!-- SHINY LUXRAY -->
  <div class="card luxray">
    <img src="assets/shiny-luxray.gif">
    <h3>⚡ Shiny Luxray</h3>
    <a href="registro-shiny-luxray.html">Abrir registro</a>
  </div>

  <!-- SHINY MACHAMP -->
  <div class="card machamp">
    <img src="assets/shiny-machamp.gif">
    <h3>👊 Shiny Machamp</h3>
    <a href="registro-shiny-machamp.html">Abrir registro</a>
  </div>

  <!-- SHINY TANGELA -->
  <div class="card tangela">
    <img src="assets/shiny-tangela.gif">
    <h3>🌿 Shiny Tangela</h3>
    <a href="registro-shiny-tangela.html">Abrir registro</a>
  </div>

  <!-- SHINY BLASTOISE -->
  <div class="card blastoise">
    <img src="assets/shiny-blastoise.gif">
    <h3>🐢 Shiny Blastoise</h3>
    <a href="registro-shiny-blastoise.html">Abrir registro</a>
  </div>

</div>

</body>
</html>
