<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Histórico de Hunts • PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("../assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* VOLTAR */
.back-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  background: linear-gradient(135deg,#c62828,#8e0000);
  color: #fff;
  padding: 10px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: 70px auto 40px;
  background: rgba(255,255,255,0.96);
  padding: 26px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header {
  text-align: center;
  margin-bottom: 26px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}

/* CARD */
.card {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  text-decoration: none;
  color: #222;
  font-weight: bold;
  transition: transform 0.2s;
  position: relative;
}

.card:hover {
  transform: scale(1.05);
}

.card small {
  display: block;
  margin-top: 6px;
  font-weight: normal;
  color: #555;
}

/* 🏆 TOP 3 */
.top1 {
  border: 3px solid #fbc02d;
  background: linear-gradient(135deg,#fffde7,#fff9c4);
}

.top2 {
  border: 3px solid #b0bec5;
  background: #eceff1;
}

.top3 {
  border: 3px solid #bcaaa4;
  background: #efebe9;
}

.badge {
  position: absolute;
  top: -12px;
  right: 14px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75em;
  font-weight: bold;
  color: #000;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

.top1 .badge { background: #fbc02d; }
.top2 .badge { background: #b0bec5; }
.top3 .badge { background: #bcaaa4; }
</style>
</head>

<body>

<a href="../planejamentos-gerais.html" class="back-btn">⬅️ Planejamentos</a>

<div class="container">

<div class="header">
  <h1>📊 Histórico de Hunts</h1>
  <p>Top 3 automático por loot • organizado por eficiência</p>
</div>

<div class="grid" id="huntGrid">

  <!-- HUNT -->
  <a href="hunt-sandaconda-2026-01-25.html" class="card" data-loot="7.6">
    🐍 Sandaconda
    <small>📅 25/01/2026 • 2h • 7.6 KK</small>
  </a>

  <a href="hunt-sandaconda-2026-01-27.html" class="card" data-loot="8.1">
    🐍 Sandaconda
    <small>📅 27/01/2026 • 2h • 8.1 KK</small>
  </a>

  <!-- novas hunts entram aqui -->
</div>

</div>

<script>
const cards = Array.from(document.querySelectorAll(".card"));

cards
  .sort((a, b) => parseFloat(b.dataset.loot) - parseFloat(a.dataset.loot))
  .slice(0, 3)
  .forEach((card, index) => {
    card.classList.add(`top${index + 1}`);
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = `🏆 TOP ${index + 1}`;
    card.appendChild(badge);
  });
</script>

</body>
</html>
