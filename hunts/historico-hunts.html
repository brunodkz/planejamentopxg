<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Dashboard PXG • Histórico de Hunts</title>

<style>
:root{
  --panel:#111827;
  --card:#1f2933;
  --solo:#2563eb;
  --duo:#7c3aed;
  --grass:#16a34a;
  --water:#0284c7;
  --desert:#ca8a04;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#e5e7eb;
}

/* HEADER */
header{
  padding:24px;
  text-align:center;
}
header h1{margin:0}
header p{opacity:.7}

/* GRID */
.dashboard{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
  max-width:1300px;
  margin:auto;
  padding:20px;
}

/* SIDEBAR */
.sidebar{
  background:var(--panel);
  border-radius:18px;
  padding:20px;
}

.sidebar h2{text-align:center;margin-top:0}

.sidebar ul{
  list-style:none;
  padding:0;
}

.sidebar li{
  padding:10px;
  margin-bottom:8px;
  background:#020617;
  border-radius:12px;
  font-weight:bold;
}

/* FILTERS */
.filters{
  display:grid;
  gap:10px;
  margin-bottom:16px;
}

.filters input,
.filters select{
  padding:10px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:#e5e7eb;
  font-weight:bold;
}

/* CONTENT */
.content{
  display:grid;
  gap:18px;
}

/* CARD */
.hunt-card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  text-decoration:none;
  color:#e5e7eb;
  display:grid;
  gap:10px;
  position:relative;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  transition:.2s;
}
.hunt-card:hover{transform:scale(1.02)}

.hunt-title{
  font-size:1.3em;
  font-weight:bold;
}

/* BADGES */
.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:.75em;
  font-weight:bold;
  background:#020617;
}

/* TYPES */
.solo{border-left:6px solid var(--solo)}
.duo{border-left:6px solid var(--duo)}
.grass{background:linear-gradient(135deg,#052e16,#064e3b)}
.water{background:linear-gradient(135deg,#020617,#082f49)}
.desert{background:linear-gradient(135deg,#451a03,#78350f)}

/* TOP BADGES */
.top-1::after,
.top-2::after,
.top-3::after{
  position:absolute;
  top:-12px;
  right:14px;
  padding:6px 12px;
  border-radius:999px;
  font-size:.75em;
  font-weight:bold;
}
.top-1::after{content:"🥇 TOP 1";background:#facc15;color:#000}
.top-2::after{content:"🥈 TOP 2";background:#cbd5e1;color:#000}
.top-3::after{content:"🥉 TOP 3";background:#cd7f32;color:#000}
</style>
</head>

<body>

<header>
  <h1>📊 Dashboard PXG</h1>
  <p>Eficiência • Inteligência • Decisão</p>
</header>

<section class="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>🏆 Rankings PXG</h2>

  <div class="filters">
    <input type="text" id="search" placeholder="🔍 Buscar hunt...">

    <select id="filterType">
      <option value="">Todos os tipos</option>
      <option value="solo">Solo</option>
      <option value="duo">Duo</option>
    </select>

    <select id="filterBiome">
      <option value="">Todos os biomas</option>
      <option value="grass">Grass</option>
      <option value="water">Water</option>
      <option value="desert">Desert</option>
    </select>
  </div>

  <ul id="ranking"></ul>
</aside>

<!-- CONTENT -->
<main class="content" id="hunts">

<a class="hunt-card solo grass" data-loot="2.6">
  <div class="hunt-title">🌿 Mixed Grass</div>
  <div class="badges"><span class="badge">👤 SOLO</span><span class="badge">💰 2.6 KK</span></div>
</a>

<a class="hunt-card solo grass" data-loot="2.9">
  <div class="hunt-title">🌿 Mixed Grass (Sul)</div>
  <div class="badges"><span class="badge">👤 SOLO</span><span class="badge">💰 2.9 KK</span></div>
</a>

<a class="hunt-card solo grass" data-loot="3.1">
  <div class="hunt-title">🍎 Appletun</div>
  <div class="badges"><span class="badge">👤 SOLO</span><span class="badge">💰 3.1 KK</span></div>
</a>

<a class="hunt-card solo water" data-loot="3.6">
  <div class="hunt-title">🦈 Sharpedo</div>
  <div class="badges"><span class="badge">👤 SOLO</span><span class="badge">💰 3.6 KK</span></div>
</a>

<a class="hunt-card duo desert" data-loot="7.6">
  <div class="hunt-title">🐍 Sandaconda</div>
  <div class="badges"><span class="badge">👥 DUO</span><span class="badge">💰 7.6 KK</span></div>
</a>

</main>
</section>

<script>
const hunts = [...document.querySelectorAll(".hunt-card")];
const ranking = document.getElementById("ranking");

/* ===== RANKING DEFINITIVO ===== */
const sorted = [...hunts].sort((a,b)=>Number(b.dataset.loot)-Number(a.dataset.loot));

ranking.innerHTML = "";
sorted.forEach((hunt,index)=>{
  if(index < 3) hunt.classList.add(`top-${index+1}`);

  const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔹";
  ranking.innerHTML += `<li>${medal} TOP ${index+1} — ${hunt.querySelector(".hunt-title").innerText}</li>`;
});

/* FILTER SYSTEM */
const search = document.getElementById("search");
const filterType = document.getElementById("filterType");
const filterBiome = document.getElementById("filterBiome");

function applyFilters(){
  hunts.forEach(h=>{
    const name = h.innerText.toLowerCase();
    const typeOk = !filterType.value || h.classList.contains(filterType.value);
    const biomeOk = !filterBiome.value || h.classList.contains(filterBiome.value);
    const searchOk = name.includes(search.value.toLowerCase());

    h.style.display = typeOk && biomeOk && searchOk ? "" : "none";
  });
}

[search, filterType, filterBiome].forEach(el=>el.addEventListener("input", applyFilters));
</script>

</body>
</html>
