<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Histórico de Hunts • PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("../assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* VOLTAR */
.back-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  background: linear-gradient(135deg,#c62828,#8e0000);
  color: #fff;
  padding: 10px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
}

/* CONTAINER */
.container {
  max-width: 950px;
  margin: 70px auto 40px;
  background: rgba(255,255,255,0.96);
  padding: 26px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

/* RANKING PXG */
.ranking {
  background: #212121;
  color: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 25px;
}

.ranking h2 {
  margin-top: 0;
  text-align: center;
}

.ranking ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.ranking li {
  padding: 6px 0;
  font-weight: bold;
}

/* FILTROS */
.filters {
  display: grid;
  gap: 12px;
  margin-bottom: 25px;
}

.filters input,
.filters select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-weight: bold;
}

/* LISTA */
.hunt-list {
  display: grid;
  gap: 18px;
}

.hunt-card {
  background: #f7f7f7;
  border-radius: 18px;
  padding: 18px 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  text-decoration: none;
  color: #222;
  transition: transform 0.2s;
  position: relative;
}

.hunt-card:hover {
  transform: scale(1.03);
}

.hunt-title {
  font-size: 1.2em;
  font-weight: bold;
}

.hunt-meta {
  margin-top: 8px;
  font-size: 0.95em;
  color: #444;
}

/* TOP 3 */
.top-1 { border: 3px solid #fbc02d; background: #fffde7; }
.top-2 { border: 3px dashed #b0bec5; }
.top-3 { border: 3px dashed #cd7f32; }

.top-1::before,
.top-2::before,
.top-3::before {
  position: absolute;
  top: -12px;
  right: 16px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75em;
}

.top-1::before { content: "🥇 TOP 1"; background:#fbc02d; }
.top-2::before { content: "🥈 TOP 2"; background:#b0bec5; }
.top-3::before { content: "🥉 TOP 3"; background:#cd7f32; }

</style>
</head>

<body>

<a href="../planejamentos-gerais.html" class="back-btn">⬅️ Planejamentos</a>

<div class="container">

<div class="header">
  <h1>📅 Histórico de Hunts</h1>
  <p>Eficiência • decisão • inteligência PXG</p>
</div>

<!-- 🏆 RANKING PXG -->
<div class="ranking">
  <h2>🏆 Rankings PXG</h2>
  <ul id="rankingList"></ul>
</div>

<!-- FILTROS -->
<div class="filters">
  <input type="text" id="playerFilter" placeholder="👥 Filtrar por player">
  <input type="number" id="lootFilter" placeholder="💰 Loot mínimo (KK)" step="0.1">
  <select id="dateFilter">
    <option value="">📅 Ordenar por data</option>
    <option value="desc">Mais recente</option>
    <option value="asc">Mais antiga</option>
  </select>
</div>

<div class="hunt-list">

<a class="hunt-card" data-date="2026-01-27" data-loot="7.6" data-time="2" data-players="2">
  <div class="hunt-title">🐍 Sandaconda</div>
  <div class="hunt-meta">Duo • 2h • 7.6 KK</div>
</a>

<a class="hunt-card" data-date="2026-01-29" data-loot="2.6" data-time="2" data-players="1">
  <div class="hunt-title">🌿 Mixed Grass</div>
  <div class="hunt-meta">Solo • 2h • 2.6 KK</div>
</a>

<a class="hunt-card" data-date="2026-02-01" data-loot="3.6" data-time="3" data-players="1">
  <div class="hunt-title">🦈 Sharpedo</div>
  <div class="hunt-meta">Solo • 3h • 3.6 KK</div>
</a>

<a class="hunt-card" data-date="2027-01-30" data-loot="1.6" data-time="1" data-players="1">
  <div class="hunt-title">🍏 Appletun</div>
  <div class="hunt-meta">Solo • 1h • 1.6 KK</div>
</a>

<a class="hunt-card" data-date="2026-02-01" data-loot="1.3" data-time="1" data-players="1">
  <div class="hunt-title">🌿 Mixed Grass (Sul)</div>
  <div class="hunt-meta">Solo • 1h • 1.3 KK</div>
</a>

</div>
</div>

<script>
const hunts = [...document.querySelectorAll(".hunt-card")];
const ranking = document.getElementById("rankingList");

/* TOP 3 */
hunts
  .sort((a,b)=>b.dataset.loot-a.dataset.loot)
  .slice(0,3)
  .forEach((h,i)=>h.classList.add(`top-${i+1}`));

/* RANKINGS */
const bestLoot = hunts.reduce((a,b)=>b.dataset.loot>a.dataset.loot?b:a);
const bestKkh = hunts.reduce((a,b)=>
  (b.dataset.loot/b.dataset.time)>(a.dataset.loot/a.dataset.time)?b:a);
const bestSolo = hunts.filter(h=>h.dataset.players==1)
  .reduce((a,b)=>b.dataset.loot>a.dataset.loot?b:a);
const bestDuo = hunts.filter(h=>h.dataset.players>1)
  .reduce((a,b)=>b.dataset.loot>a.dataset.loot?b:a, null);

ranking.innerHTML = `
<li>🥇 Maior Loot: ${bestLoot.querySelector(".hunt-title").innerText}</li>
<li>⚡ Melhor KK/h: ${bestKkh.querySelector(".hunt-title").innerText}</li>
<li>👤 Melhor Solo: ${bestSolo.querySelector(".hunt-title").innerText}</li>
${bestDuo ? `<li>👥 Melhor Duo: ${bestDuo.querySelector(".hunt-title").innerText}</li>` : ""}
`;
</script>

</body>
</html>
