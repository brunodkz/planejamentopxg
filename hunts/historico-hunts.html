<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Dashboard PXG • Histórico de Hunts</title>

<style>
:root{
  --panel:#111827;
  --card:#1f2933;
  --solo:#2563eb;
  --duo:#7c3aed;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#e5e7eb;
}

/* HEADER */
header{
  padding:24px;
  text-align:center;
}

/* GRID */
.dashboard{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
  max-width:1300px;
  margin:auto;
  padding:20px;
}

/* SIDEBAR */
.sidebar{
  background:#111827;
  border-radius:18px;
  padding:20px;
}

.sidebar ul{
  list-style:none;
  padding:0;
}
.sidebar li{
  padding:10px;
  margin-bottom:8px;
  background:#020617;
  border-radius:12px;
  font-weight:bold;
}

/* FILTERS */
.filters{
  display:grid;
  gap:10px;
  margin-bottom:16px;
}
.filters input,
.filters select{
  padding:10px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:#e5e7eb;
  font-weight:bold;
}

/* CONTENT */
.content{
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* CARD */
.hunt-card{
  background:#1f2933;
  border-radius:18px;
  padding:18px;
  text-decoration:none;
  color:#e5e7eb;
  display:grid;
  gap:10px;
  position:relative;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  transition:.2s;
}
.hunt-card:hover{transform:scale(1.02)}

.solo{border-left:6px solid var(--solo)}
.duo{border-left:6px solid var(--duo)}

/* TOP BADGES */
.top-1::after,
.top-2::after,
.top-3::after{
  position:absolute;
  top:-12px;
  right:14px;
  padding:6px 12px;
  border-radius:999px;
  font-size:.75em;
  font-weight:bold;
}
.top-1::after{content:"🥇 TOP 1";background:#facc15;color:#000}
.top-2::after{content:"🥈 TOP 2";background:#cbd5e1;color:#000}
.top-3::after{content:"🥉 TOP 3";background:#cd7f32;color:#000}
</style>
</head>

<body>

<header>
  <h1>📊 Dashboard PXG</h1>
</header>

<section class="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>🏆 Rankings PXG</h2>

  <div class="filters">
    <input type="text" id="search" placeholder="🔍 Buscar hunt...">
    <select id="filterType">
      <option value="">Todos</option>
      <option value="solo">Solo</option>
      <option value="duo">Duo</option>
    </select>
  </div>

  <ul id="ranking"></ul>
</aside>

<!-- CONTENT -->
<main class="content" id="hunts">

<a class="hunt-card solo" data-loot="2.6">
  🌿 Mixed Grass • 💰 2.6 KK
</a>

<a class="hunt-card solo" data-loot="2.9">
  🌿 Mixed Grass (Sul) • 💰 2.9 KK
</a>

<a class="hunt-card solo" data-loot="3.1">
  🍎 Appletun • 💰 3.1 KK
</a>

<a class="hunt-card solo" data-loot="3.6">
  🦈 Sharpedo • 💰 3.6 KK
</a>

<a class="hunt-card duo" data-loot="7.6">
  🐍 Sandaconda • 💰 7.6 KK
</a>

</main>
</section>

<script>
const hunts = [...document.querySelectorAll(".hunt-card")];
const ranking = document.getElementById("ranking");

/* ===== ORDENACAO REAL ===== */
const sorted = [...hunts].sort(
  (a,b)=> Number(b.dataset.loot) - Number(a.dataset.loot)
);

/* ranking lateral */
ranking.innerHTML = "";
sorted.forEach((hunt,index)=>{
  if(index < 3) hunt.classList.add(`top-${index+1}`);

  ranking.innerHTML += `
    <li>TOP ${index+1} — ${hunt.innerText}</li>
  `;

  /* ordem visual sem quebrar DOM */
  hunt.style.order = index;
});

/* FILTROS */
const search = document.getElementById("search");
const filterType = document.getElementById("filterType");

function applyFilters(){
  hunts.forEach(h=>{
    const txt = h.innerText.toLowerCase();
    const okType = !filterType.value || h.classList.contains(filterType.value);
    const okSearch = txt.includes(search.value.toLowerCase());
    h.style.display = okType && okSearch ? "" : "none";
  });
}

[search, filterType].forEach(el =>
  el.addEventListener("input", applyFilters)
);
</script>

</body>
</html>
