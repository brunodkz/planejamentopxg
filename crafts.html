<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ Crafts • PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("./assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* VOLTAR */
.back-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  background: linear-gradient(135deg,#c62828,#8e0000);
  color: #fff;
  padding: 10px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
}

/* CONTAINER */
.container {
  max-width: 950px;
  margin: 70px auto 40px;
  background: rgba(255,255,255,0.96);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

/* TEMAS */
.rock { background: linear-gradient(135deg,#6d4c41,#a1887f); color:#fff; }
.water { background: linear-gradient(135deg,#42a5f5,#1565c0); color:#fff; }
.grass { background: linear-gradient(135deg,#66bb6a,#2e7d32); color:#fff; }
.fire { background: linear-gradient(135deg,#ff7043,#d84315); color:#fff; }
.magic { background: linear-gradient(135deg,#ba68c8,#6a1b9a); color:#fff; }

.card small {
  display: block;
  margin-top: 8px;
  font-weight: normal;
}
</style>
</head>

<body>

<a href="menu.html" class="back-btn">⬅️ Menu</a>

<div class="container">

<div class="header">
  <h1>🛠️ Área de Crafts</h1>
  <p>Berries • Elixires • Produção</p>
</div>

<div class="grid">

  <div class="card rock">
    🪨 Rock Berry
    <small>Produção sólida</small>
  </div>

  <div class="card water">
    💧 Water Berry
    <small>Foco em sustain</small>
  </div>

  <div class="card grass">
    🌿 Grass Berry
    <small>Recuperação contínua</small>
  </div>

  <div class="card fire">
    🔥 Fire Berry
    <small>Dano & agressividade</small>
  </div>

  <div class="card magic">
    🧪 Elixires
    <small>Buffs temporários</small>
  </div>

</div>

</div>
</body>
</html>
