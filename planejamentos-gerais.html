<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 Planejamentos Gerais • PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("./assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* VOLTAR */
.back-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  background: linear-gradient(135deg,#c62828,#8e0000);
  color: #fff;
  padding: 10px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: 70px auto 40px;
  background: rgba(255,255,255,0.96);
  padding: 26px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

/* BOTÕES */
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
}

.menu a {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 18px;
  text-align: center;
  text-decoration: none;
  color: #222;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  transition: transform 0.2s;
}

.menu a:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<a href="menu.html" class="back-btn">⬅️ Menu</a>

<div class="container">

  <div class="header">
    <h1>📘 Planejamentos Gerais</h1>
    <p>Organização • Testes • Estratégia</p>
  </div>

  <div class="menu">

    <!-- SANDACONDA / TESTES DE HUNTS -->
    <a href="hunts/historico-hunts.html">
      🧪 Testes de Hunts<br>
      <small>Resultados e métricas</small>
    </a>
  </div>

</div>
</body>
</html>
