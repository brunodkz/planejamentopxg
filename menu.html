<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📂 Menu • Planejamento PXG</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: url("./assets/pokeballs-bg-v2.png") repeat;
  background-size: 300px;
}

/* CONTAINER */
.container {
  max-width: 950px;
  margin: 70px auto;
  background: rgba(255,255,255,0.96);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.header {
  text-align: center;
  margin-bottom: 34px;
}

/* GRID */
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
}

/* BOTÕES */
.menu a {
  padding: 24px 20px;
  border-radius: 20px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  color: #222;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  transition: transform 0.2s, box-shadow 0.2s;
}

.menu a:hover {
  transform: scale(1.06);
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}

/* TEMAS */
.btn-conquistas {
  background: linear-gradient(135deg,#fbc02d,#7cb342);
}

.btn-crafts {
  background: linear-gradient(135deg,#8d6e63,#a1887f);
}

.btn-planejamento {
  background: linear-gradient(135deg,#90caf9,#1976d2);
}

.menu small {
  display: block;
  margin-top: 6px;
  font-weight: normal;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>📂 Menu Principal</h1>
  <p>Organização • Conquistas • Crafts</p>
</div>

<div class="menu">

  <a href="conquistas-negociacoes.html" class="btn-conquistas">
    🏆 Conquistas & Negociações
    <small>Shinys • Histórico • Valores</small>
  </a>

  <a href="crafts.html" class="btn-crafts">
    🛠️ Crafts & Plantações
    <small>Berries • Elixires • Recursos</small>
  </a>

  <a href="planejamentos-gerais.html" class="btn-planejamento">
    📘 Planejamentos Gerais
    <small>Testes • Hunts • Estratégias</small>
  </a>

</div>

</div>
</body>
</html>
